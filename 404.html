<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#ff4a3d">
  <title>Page not found | TVL Data Transfer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope','Segoe UI',sans-serif;color:#111;background:
      radial-gradient(620px 320px at 15% 10%, rgba(255,73,49,0.10), transparent 60%),
      radial-gradient(520px 320px at 85% 15%, rgba(255,73,49,0.07), transparent 62%),
      #f7f6f4;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .wrap{max-width:560px}
    .code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(72px,18vw,140px);line-height:1;color:#ff4a3d}
    h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(24px,4vw,34px);margin:8px 0 14px;color:#1c1c1c}
    p{font-size:17px;line-height:1.6;color:#4a4a4a;margin-bottom:32px}
    .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    a.btn{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;text-decoration:none;padding:14px 30px;border-radius:6px}
    a.primary{background:#d63a2a;color:#fff}
    a.ghost{border:2px solid rgba(0,0,0,0.2);color:#1c1c1c}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page moved, or never existed</h1>
    <p>The sovereign data layer is still here. Let's get you back to TVL Data Transfer.</p>
    <div class="btns">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn ghost" href="/ro/">Versiunea în română</a>
    </div>
  </div>
</body>
</html>
